---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_7_1_4 }}
file:
  /etc/group-_perms:
    title: 7.1.4 | Ensure access to /etc/group- is configured
    exists: true
    path: /etc/group-
    mode:
      match-regexp: '^0[0246][04][04]$'
    owner: root
    group: root
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.1.4
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
