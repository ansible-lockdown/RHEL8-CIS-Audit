---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_7_1_3 }}
file:
  /etc/group_perms:
    title: 7.1.3 | Ensure permissions on /etc/group are configured
    exists: true
    path: /etc/group
    mode:
      or:
      - '0644'
      - '0640'
      - '0600'
      - '0400'
    owner: root
    group: root
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.1.3
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
