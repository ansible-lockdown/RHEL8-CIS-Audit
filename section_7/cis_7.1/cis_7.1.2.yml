---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_7_1_2 }}
file:
  /etc/passwd-_perms:
    title: 7.1.2 | Ensure access to /etc/passwd- is configured
    exists: true
    path: /etc/passwd-
    mode:
      match-regexp: '^0[0246][04][04]$'
    owner: root
    group: root
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 7.1.2
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
