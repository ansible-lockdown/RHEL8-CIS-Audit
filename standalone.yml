gossfile:
  {{ if .Vars.rhel8cis_section1 }}
  section_1/*/*.yml: {}
  {{ end }}

  {{ if .Vars.rhel8cis_section2 }}
  section_2/*/*.yml: {}
  {{ end }}

  {{ if .Vars.rhel8cis_section3 }}
  section_3/cis_3.1.x/*.yml: {}
  section_3/cis_3.2.x/*.yml: {}
  section_3/cis_3.3.1.x/*.yml: {}
  {{ if .Vars.rhel8cis_ipv6_required }}
  section_3/cis_3.3.2.x/*.yml: {}
  {{ end }}
  {{ end }}

  {{ if .Vars.rhel8cis_section4 }}
  {{ if eq .Vars.rhel8cis_firewall "firewalld" }}
  section_4/*/*.yml: {}
  {{ end }}
  {{ end }}

  {{ if .Vars.rhel8cis_section5 }}
  section_5/*/*.yml: {}
  {{ end }}

  {{ if .Vars.rhel8cis_section6 }}
  section_6/cis_6.1.x/*.yml: {}
  {{ if eq .Vars.rhel8cis_syslog "journald" }}
  section_6/cis_6.2.1.1.x/*.yml: {}
  section_6/cis_6.2.1.2.x/*.yml: {}
  {{ end }}
  {{ if eq .Vars.rhel8cis_syslog "rsyslog" }}
  section_6/cis_6.2.2.x/*.yml: {}
  {{ end }}
  section_6/cis_6.3.*.x/*.yml: {}
  {{ end }}

  {{ if .Vars.rhel8cis_section7 }}
  section_7/*/*.yml: {}
  {{ end }}
