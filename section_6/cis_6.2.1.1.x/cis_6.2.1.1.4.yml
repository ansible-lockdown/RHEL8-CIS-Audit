---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_6_2_1_1_4 }}
    {{ if eq .Vars.rhel8cis_syslog "journald" }}
command:
  journald_syslog:
    title: 6.2.1.1.4 | Ensure journald ForwardToSyslog is disabled
    exec: systemd-analyze cat-config systemd/journald.conf | grep -Ei '^\s*ForwardToSyslog\s*=' | tail -n 1
    exit-status: 0
    stdout:
    - '!/(?i)^\s*ForwardToSyslog\s*=\s*(yes|true|1|on)\s*$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.1.1.4
      NIST800-53R5:
      - AU-2
      - AU-6
      - AU-7
      - AU-12
    {{ end }}
  {{ end }}
{{ end }}
