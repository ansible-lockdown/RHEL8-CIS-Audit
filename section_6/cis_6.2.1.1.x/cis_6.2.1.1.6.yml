---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_6_2_1_1_6 }}
command:
  compress_journald_conf:
    title: 6.2.1.1.6 | Ensure journald Compress is configured
    exec: systemd-analyze cat-config systemd/journald.conf | grep -Ei '^\s*Compress\s*=' | tail -n 1
    exit-status: 0
    stdout:
    - '!/(?i)^\s*Compress\s*=\s*(no|false|0|off)\s*$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.1.1.6
      NIST800-53R5:
      - AU-4
  {{ end }}
{{ end }}
