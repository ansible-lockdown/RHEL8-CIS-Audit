---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_6_2_1_2_4 }}
    {{ if eq .Vars.rhel8cis_syslog "journald" }}
service:
  systemd-journal-remote.socket:
    title: 6.2.1.2.4 | Ensure systemd-journal-remote service is not in use
    skip: {{ .Vars.rhel8cis_system_is_log_server }}
    skip-reason: rhel8cis_system_is_log_server is true, the role does not apply this control on a log server
    running: false
    enabled: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.1.2.4
      NIST800-53R5:
      - AU-2
      - AU-7
      - AU-12
  systemd-journal-remote.service:
    title: 6.2.1.2.4 | Ensure systemd-journal-remote service is not in use
    skip: {{ .Vars.rhel8cis_system_is_log_server }}
    skip-reason: rhel8cis_system_is_log_server is true, the role does not apply this control on a log server
    running: false
    enabled: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.1.2.4
      NIST800-53R5:
      - AU-2
      - AU-7
      - AU-12
    {{ end }}
  {{ end }}
{{ end }}
