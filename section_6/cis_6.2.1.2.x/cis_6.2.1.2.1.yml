---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_6_2_1_2_1 }}
    {{ if eq .Vars.rhel8cis_syslog "journald" }}
package:
  systemd-journal-remote:
    title: 6.2.1.2.1 | Ensure systemd-journal-remote is installed
    skip: {{ .Vars.rhel8cis_system_is_log_server }}
    skip-reason: rhel8cis_system_is_log_server is true, the role does not apply this control on a log server
    installed: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.1.2.1
      NIST800-53R5:
      - AU-2
      - AU-7
      - AU-12
    {{ end }}
  {{ end }}
{{ end }}
