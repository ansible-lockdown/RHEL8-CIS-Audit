---

{{ if .Vars.rhel8cis_level_2 }}
  {{ if .Vars.rhel8cis_rule_6_3_4_1 }}
command:
  audit_logfile_dir_perms:
    title: 6.3.4.1 | Ensure the audit log file directory mode is configured
    exec: |
      l_dir=""
      [ -f /etc/audit/auditd.conf ] && l_dir="$(awk -F= '/^\s*log_file\s*=/{print $2}' /etc/audit/auditd.conf | xargs)"
      if [ -z "$l_dir" ]; then
        echo "FAIL: log_file is not set in /etc/audit/auditd.conf"
      elif [ ! -d "$(dirname "$l_dir")" ]; then
        echo "FAIL: audit log directory $(dirname "$l_dir") does not exist"
      else
        l_dir="$(dirname "$l_dir")"
        l_mode="$(stat -Lc '%a' "$l_dir")"
        [ $(( 0$l_mode & 027 )) -eq 0 ] || echo "FAIL: $l_dir is mode $l_mode, should be 750 or more restrictive"
      fi
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.3.4.1
      NIST800-53R5:
      - AU-3
  {{ end }}
{{ end }}
