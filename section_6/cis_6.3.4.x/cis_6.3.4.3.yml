---

{{ if .Vars.rhel8cis_level_2 }}
  {{ if .Vars.rhel8cis_rule_6_3_4_3 }}
command:
  audit_logfile_owner:
    title: 6.3.4.3 | Ensure audit log files owner is configured
    exec: |
      l_dir=""
      [ -f /etc/audit/auditd.conf ] && l_dir="$(awk -F= '/^\s*log_file\s*=/{print $2}' /etc/audit/auditd.conf | xargs)"
      if [ -z "$l_dir" ]; then
        echo "FAIL: log_file is not set in /etc/audit/auditd.conf"
      elif [ ! -d "$(dirname "$l_dir")" ]; then
        echo "FAIL: audit log directory $(dirname "$l_dir") does not exist"
      else
        l_dir="$(dirname "$l_dir")"
        find "$l_dir" -maxdepth 1 -type f ! -user root -printf 'FAIL: %p is owned by %u\n'
      fi
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.3.4.3
      NIST800-53R5:
      - CM-7
  {{ end }}
{{ end }}
