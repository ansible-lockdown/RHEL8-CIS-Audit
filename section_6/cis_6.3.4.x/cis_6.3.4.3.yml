---

{{ if .Vars.rhel8cis_level_2 }}
  {{ if .Vars.rhel8cis_rule_6_3_4_3 }}
command:
  audit_logfile_owner:
    title: 6.3.4.3 | Ensure audit log files owner is configured
    exec: for file in `grep ^log_file /etc/audit/auditd.conf | awk '{ print $NF }'`; do stat -Lc "%n_%U" $file; done
    exit-status: 0
    stdout:
    - '/.*_root$/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.3.4.3
      NIST800-53R5:
      - CM-7
  {{ end }}
{{ end }}
