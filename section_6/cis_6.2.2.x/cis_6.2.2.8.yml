---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_6_2_2_8 }}
file:
  /etc/logrotate.conf:
    title: 6.2.2.8 | Ensure logrotate is configured
    exists: true
    contents:
    - '/^\s*{{ .Vars.rhel8cis_logrotate }}\s*$/'
    - '/^\s*rotate\s+[0-9]+/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.2.8
      NIST800-53R5:
      - AU-8
  {{ end }}
{{ end }}
