---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_6_2_2_7 }}
command:
  local_syslog_module:
    title: 6.2.2.7 | Ensure rsyslog is not configured to receive logs from a remote client | module
    skip: {{ or .Vars.rhel8cis_system_is_log_server (not .Vars.rhel8cis_rsyslog_ansiblemanaged) }}
    exec: grep "imtcp" /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -Ev ":#|port="
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '!/.*/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.2.7
      NIST800-53R5:
      - AU-2
      - AU-7
      - AU-12
      - CM-6
  local_syslog_input:
    title: 6.2.2.7 | Ensure rsyslog is not configured to receive logs from a remote client | server/port
    skip: {{ or .Vars.rhel8cis_system_is_log_server (not .Vars.rhel8cis_rsyslog_ansiblemanaged) }}
    exec: grep -E "imtcp\" port|InputTCPServerRun" /etc/rsyslog.conf /etc/rsyslog.d/*.conf | grep -v ":#"
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '!/.*/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.2.7
      NIST800-53R5:
      - AU-2
      - AU-7
      - AU-12
      - CM-6
  {{ end }}
{{ end }}
