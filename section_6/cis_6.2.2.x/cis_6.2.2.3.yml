---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_6_2_2_3 }}
command:
  forward_journald_conf:
    title: 6.2.2.3 | Ensure journald is configured to send logs to rsyslog
    exec: grep -ris '^\s*ForwardToSyslog' /etc/systemd/journald.conf /etc/systemd/journald.conf.d/
    exit-status:
      or:
      - 0
      - 2
    stdout:
    - '/(?i)^.*:ForwardToSyslog\s*=\s*yes/'
    - '!/(?i)^.*:ForwardToSyslog\s*=\s*no/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.2.3
      NIST800-53R5:
      - AC-3
      - AU-2
      - AU-4
      - AU-12
      - MP-2
  {{ end }}
{{ end }}
