---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_6_2_3_1 }}
command:
  logfile_configured_login_files:
    title: 6.2.3.1 | Ensure access to all logfiles has been configured | lastlog, wtmp, btmp and README 0664 or more restrictive
    skip: {{ not .Vars.rhel8cis_disruption_high }}
    skip-reason: rhel8cis_disruption_high is false, the role does not change log file access
    exec: |
      find -L /var/log -regextype posix-extended -type f ! -regex '/var/log/(gdm|sssd).*' -regex '.*/(lastlog([.][^/]*)?|(wtmp|btmp)([.-][^/]*)?|README)' -perm /0113 -printf 'FAIL: %p %m\n'
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.3.1
      NIST800-53R5:
      - AU-8
  logfile_configured_sssd:
    title: 6.2.3.1 | Ensure access to all logfiles has been configured | gdm and sssd logs 0660 or more restrictive
    skip: {{ not .Vars.rhel8cis_disruption_high }}
    skip-reason: rhel8cis_disruption_high is false, the role does not change log file access
    exec: |
      find -L /var/log -regextype posix-extended -type f -regex '/var/log/(gdm|sssd).*' -perm /0117 -printf 'FAIL: %p %m\n'
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.3.1
      NIST800-53R5:
      - AC-3
      - MP-2
  logfile_configured_syslog_logs:
    title: 6.2.3.1 | Ensure access to all logfiles has been configured | all other logs 0640 or more restrictive
    skip: {{ not .Vars.rhel8cis_disruption_high }}
    skip-reason: rhel8cis_disruption_high is false, the role does not change log file access
    exec: |
      find -L /var/log -regextype posix-extended -type f ! -regex '/var/log/(gdm|sssd).*' ! -regex '.*/(lastlog([.][^/]*)?|(wtmp|btmp)([.-][^/]*)?|README)' -perm /0137 -printf 'FAIL: %p %m\n'
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.2.3.1
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
