---

{{ if .Vars.rhel8cis_level_2 }}
  {{ if .Vars.rhel8cis_rule_6_3_3_14 }}
command:
  auditd_MAC_cnf:
    title: 6.3.3.14 | Ensure events that modify the system's Mandatory Access Controls are collected
    exec: grep MAC-policy /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/^.*rules:-w /etc/selinux/ -p wa -k MAC-policy/'
    - '/^.*rules:-w /usr/share/selinux/ -p wa -k MAC-policy/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.3.3.14
      NIST800-53R5:
      - AU-3
      - CM-6
  auditd_MAC_live:
    title: 6.3.3.14 | Ensure events that modify the system's Mandatory Access Controls are collected
    exec: auditctl -l | grep MAC-policy
    exit-status: 0
    stdout:
    - '/^-w /etc/selinux -p wa -k MAC-policy/'
    - '/^-w /usr/share/selinux -p wa -k MAC-policy/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.3.3.14
      NIST800-53R5:
      - AU-3
      - CM-6
  {{ end }}
{{ end }}
