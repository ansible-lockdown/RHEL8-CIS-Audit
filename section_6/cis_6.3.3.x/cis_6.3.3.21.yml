---

{{ if .Vars.rhel8cis_level_2 }}
  {{ if .Vars.rhel8cis_rule_6_3_3_21 }}
command:
  auditd_immutable:
    title: 6.3.3.21 | Ensure the audit configuration is immutable
    exec: grep -Ph -- '^\h*-e\h+2\b' /etc/audit/rules.d/*.rules | tail -1
    exit-status: 0
    stdout:
    - '/^\s*-e\s+2\b/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.3.3.21
      NIST800-53R5:
      - AU-9
  {{ end }}
{{ end }}
