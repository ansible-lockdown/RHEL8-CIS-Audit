---

{{ if .Vars.rhel8cis_level_2 }}
  {{ if .Vars.rhel8cis_rule_6_3_3_3 }}
command:
  modify_sudolog_cnf:
    title: 6.3.3.3 | Ensure events that modify the sudo log file are collected | conf_check
    exec: grep sudo_log /etc/audit/rules.d/*.rules
    exit-status: 0
    stdout:
    - '/^.*rules:-w {{ .Vars.rhel8cis_sudolog_location }} -p wa -k sudo_log_file/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.3.3.3
      NIST800-53R5: NA
  modify_sudolog_live:
    title: 6.3.3.3 | Ensure events that modify the sudo log file are collected | running
    exec: auditctl -l | grep sudo_log
    exit-status: 0
    stdout:
    - '/^-w {{ .Vars.rhel8cis_sudolog_location }} -p wa -k sudo_log_file/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.3.3.3
      NIST800-53R5: NA
  {{ end }}
{{ end }}
