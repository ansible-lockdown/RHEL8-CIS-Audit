    exit-status: 0
    stdout:
    - '/^\/usr\/sbin\/augenrules: No change/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.3.3.22
      NIST800-53R5: AU-3
  {{ end }}
{{ end }}
