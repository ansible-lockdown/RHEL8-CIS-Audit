---

{{ if .Vars.rhel8cis_level_2 }}
  {{ if .Vars.rhel8cis_rule_6_3_1_2 }}
command:
  audit_default_grub:
    title: 6.3.1.2 | Ensure auditing for processes that start prior to auditd is enabled | config
    exec: grep audit= /etc/default/grub
    exit-status: 0
    stdout:
    - '/^\s*GRUB_CMDLINE_LINUX="([^#"]*\s)?audit=1\b/'
    meta:
      server: 2
      CIS_ID:
      - 6.3.1.2
      NIST800-53R5: AU-12
  grubby_audit_1:
    title: 6.3.1.2 | Ensure auditing for processes that start prior to auditd is enabled | live
    exec: |
      grubby --info=ALL | awk -F'"' '/^args=/{ n++; if ($2 !~ /(^| )audit=1( |$)/) print "FAIL: " $2 } END { print "entries: " n+0 }'
    exit-status: 0
    stdout:
    - '/^entries: [1-9]/'
    - '!/^FAIL:/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 6.3.1.2
      NIST800-53R5: AU-12
  {{ end }}
{{ end }}
