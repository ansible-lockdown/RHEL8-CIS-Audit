---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_6_1_2 }}
    {{ if eq .Vars.rhel8cis_aide_scan "cron" }}
command:
  aide_cron:
    title: 6.1.2 | Ensure filesystem integrity is regularly checked | cron
    exec: |
      grep -Ers '^([^#]+\s+)?(/usr/s?bin/|^\s*)aide(\.wrapper)?\s(--?\S+\s)*(--(check|update)|\$AIDEARGS)\b' /etc/cron.* /etc/crontab /var/spool/cron/
    exit-status:
      or:
      - 0
      - 2
    stdout:
    - '/aide/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.2
      NIST800-53R5:
      - AU-2
      - CM-3
    {{ end }}
    {{ if eq .Vars.rhel8cis_aide_scan "timer" }}
service:
  aidecheck:
    title: 6.1.2 | Ensure filesystem integrity is regularly checked | service
    enabled: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.2
      NIST800-53R5:
      - AU-2
      - CM-3
  aidecheck.timer:
    title: 6.1.2 | Ensure filesystem integrity is regularly checked | timer
    enabled: true
    running: true
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 6.1.2
      NIST800-53R5:
      - AU-2
      - CM-3
    {{ end }}
  {{ end }}
{{ end }}
