---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_4_1_6 }}
command:
  loopback_firewalld:
    title: 4.1.6 | Ensure firewalld loopback source address traffic is configured
    exec: |
     for zone in $(firewall-cmd --get-zone-of-interface=lo); do
     echo " - Zone: $zone"
     firewall-cmd --zone="$zone" --list-rich-rules | grep -P -- '(::1|127\.0\.0\.1)\b'
     done
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^ - Zone: \S+/'
    - '/(?i)rule family="?ipv4"? source address="?127\.0\.0\.1"? destination not address="?127\.0\.0\.1"? drop/'
    - '/(?i)rule family="?ipv6"? source address="?::1"? destination not address="?::1"? drop/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 4.1.6
      NIST800-53R5:
      - NA
  {{ end }}
{{ end }}
