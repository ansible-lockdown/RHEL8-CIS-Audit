---

{{ if .Vars.rhel8cis_gui }}
  {{ if .Vars.rhel8cis_level_2 }}
    {{ if .Vars.rhel8cis_rule_1_8_7 }}
file:
  /etc/gdm/custom.conf:
    title: 1.8.7 | Ensure Xwayland is configured
    path: /etc/gdm/custom.conf
    exists: true
    contents:
      match-regexp: '!/^\[daemon\]\nWaylandEnable\s*=\s*false/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.8.7
    {{ end }}
  {{ end }}
{{ end }}
