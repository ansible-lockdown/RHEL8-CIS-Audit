---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_1_6_6 }}
file:
  crypto_policies_no_ssh_EtM:
    title: 1.6.6 | Ensure system wide crypto policy disables EtM for ssh
    path: /etc/crypto-policies/state/CURRENT.pol
    exists: true
    contents:
    - '!/^\s*etm\b'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.6
      NIST800-53R5: SC-8
  crypto_not_EtM_config:
    title: 1.6.5 | Ensure system wide crypto policy disables EtM for ssh | config
    path: /etc/crypto-policies/policies/modules/NO-SSHETM.pmod
    exists: true
    contents:
    - '/^ssh_etm = 0/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.6.5
      NIST800-53R5: SC-8
  {{ end }}
{{ end }}
