---

{{ if .Vars.rhel8cis_level_2 }}
  {{ if .Vars.rhel8cis_rule_1_3_1_3 }}
command:
  getenforce_enforcing:
    title: 1.3.1.3 | Ensure the SELinux mode is enforcing | running
    exit-status: 0
    exec: "getenforce"
    stdout:
    - '/^Enforcing/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.3.1.5
      NIST800-53R4:
      - SC-3
      - SI-6
      CCI:
      - CCI-001084
      - CCI-002696
file:
  selinux_enforcing:
    title: 1.3.1.3 | Ensure the SELinux mode is enforcing | config
    path: /etc/selinux/config
    exists: true
    contents:
    - '/^SELINUX( |)=( |)enforcing/'
    - '!/^SELINUX( |)=( |)disabled/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.3.1.5
      NIST800-53R4:
      - SC-3
      - SI-6
      CCI:
      - CCI-001084
      - CCI-002696
  {{ end }}
{{ end }}
