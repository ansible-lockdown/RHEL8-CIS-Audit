---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_1_3_1_4 }}
command:
  getenforce:
    title: 1.3.1.4 | Ensure the SELinux mode is not disabled | running
    exit-status: 0
    exec: "getenforce"
    stdout:
    - '/^(Enforcing|Permissive)/'
    - '!/^Disabled/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.3.1.4
      NIST800-53R5:
      - SC-3
file:
  selinux_not_disabled:
    title: 1.3.1.4 | Ensure the SELinux mode is not disabled | config
    exists: true
    path: /etc/selinux/config
    contents:
    - '/^SELINUX\s*=\s*(enforcing|permissive)/'
    - '!/^SELINUX\s*=\s*disabled/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.3.1.4
      NIST800-53R5:
      - SC-3
  {{ end }}
{{ end }}
