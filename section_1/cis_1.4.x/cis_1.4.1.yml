---

{{ if .Vars.rhel8cis_rule_1_4_1 }}
  {{ if .Vars.rhel8cis_level_1 }}
file:
  grub_bootpass:
    title: 1.4.1 | Ensure bootloader password is set
    exists: true
    owner: root
    group: root
    mode: "0600"
    path: {{ .Vars.rhel8cis_boot_path }}/user.cfg
    contents:
    - '/^GRUB2_PASSWORD=grub.pbkdf2.sha512./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.4.1
      NIST800-53R5:
      - AC-3
  {{ end }}
{{ end }}
