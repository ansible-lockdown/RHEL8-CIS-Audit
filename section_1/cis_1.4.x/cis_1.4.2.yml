---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_1_4_2 }}
command:
  bootloader_file_perms:
    title: 1.4.2 | Ensure access to bootloader config is configured | /boot/grub2 files
    exec: find /boot/grub2 -type f \( -name 'grub*' -o -name 'user.cfg' \) \( -perm /0177 -o ! -user root -o ! -group root \) -exec stat -c '%n %#a %U:%G' {} +
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.4.2
      NIST800-53R5:
      - CM-6
    {{ if not .Vars.rhel8cis_legacy_boot }}
  bootloader_efi_file_perms:
    title: 1.4.2 | Ensure access to bootloader config is configured | /boot/efi/EFI files
    exec: find /boot/efi/EFI -type f \( -perm /0077 -o ! -user root -o ! -group root \) -exec stat -c '%n %#a %U:%G' {} +
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.4.2
      NIST800-53R5:
      - CM-6
mount:
  boot_efi_mask:
    title: 1.4.2 | Ensure access to bootloader config is configured | /boot/efi opts
    mountpoint: /boot/efi
    exists: true
    opts:
    - 'fmask=0077'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.4.2
      NIST800-53R5:
      - CM-6
    {{ end }}
  {{ end }}
{{ end }}
