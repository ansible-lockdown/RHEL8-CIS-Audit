---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_1_1_2_5_3 }}
mount:
  var_tmp_nosuid_options:
    title: 1.1.2.5.3 | Ensure nosuid option set on /var/tmp partition
    mountpoint: '/var/tmp'
    exists: true
    opts:
    - nosuid
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.1.2.5.3
      NIST800-53R5:
      - AC-3
      - MP-2
      - CM-7
file:
  var_tmp_fstab_nosuid_options:
     title: 1.1.2.5.3 | Ensure nosuid option set on /var/tmp partition
     exists: true
     path: /etc/fstab
     contents:
     - '/\s\/var\/tmp\s.*nosuid/'
     meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.1.2.5.3
      NIST800-53R5:
      - AC-3
      - MP-2
      - CM-7
  {{ end }}
{{ end }}
