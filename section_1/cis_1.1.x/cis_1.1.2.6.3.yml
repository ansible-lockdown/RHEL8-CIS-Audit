---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_1_1_2_6_3 }}
mount:
  var_log_nosuid_options:
    title: 1.1.2.6.3 | Ensure nosuid option set on /var/log partition
    mountpoint: '/var/log'
    exists: true
    opts:
    - nosuid
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.1.2.6.3
      NIST800-53R5:
      - AC-3
      - MP-2
      - CM-7
file:
  var_log_fstab_nosuid_options:
     title: 1.1.2.6.3 | Ensure nosuid option set on /var/log partition
     exists: true
     path: /etc/fstab
     contents:
     - '/\s\/var\/log\s.*nosuid/'
     meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.1.2.6.3
      NIST800-53R5:
      - AC-3
      - MP-2
      - CM-7
  {{ end }}
{{ end }}
