---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_1_1_1_10 }}
file:
  usb-storage_disabled:
    title: 1.1.1.10 | Ensure usb-storage kernel module is not available | modprobe
    path: /etc/modprobe.d/CIS.conf
    exists: true
    contents:
    - '/^install usb-storage /bin/(true|false)/'
    meta:
      server: 1
      workstation: 2
      CIS_ID: 1.1.1.10
      NIST800-53R5:
      - CM-7
      - IA-3
      CCI:
        - CCI-000778
        - CCI-001958
        - CCI-003959
  usb-storage_blacklist:
    title: 1.1.1.10 | Ensure usb-storage kernel module is not available | blacklist
    path: /etc/modprobe.d/blacklist.conf
    exists: true
    contents:
    - '/^blacklist usb-storage/'
    meta:
      server: 1
      workstation: 2
      CIS_ID: 1.1.1.10
      NIST800-53R5:
      - CM-7
      - IA-3
      CCI:
        - CCI-000778
        - CCI-001958
        - CCI-003959
  {{ end }}
{{ end }}
