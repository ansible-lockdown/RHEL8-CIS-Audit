---

{{ if .Vars.run_heavy_tests }}
  {{ if .Vars.rhel8cis_level_2 }}
    {{ if .Vars.rhel8cis_rule_1_2_1_3 }}
file:
  repo_gpgcheck_global:
    title: 1.2.1.3 | Ensure gpgcheck is globally active | dnf.conf
    exists: true
    path: /etc/dnf/dnf.conf
    contents:
    - '/^repo_gpgcheck=1/'
    - '!/^repo_gpgcheck=0'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.2.1.3
      NIST800-53R4: SI-2
command:
  repo_gpgcheck_repo:
    title: 1.2.1.3 | Ensure gpgcheck is globally active | repo files
    exit-status:
      or:
      - 0
      - 1
    exec: grep -E '^\s*repo_gpgcheck\s*=\s*0' /etc/yum.repos.d/*.repo
    timeout: {{ .Vars.timeout_ms }}
    stdout:
    - '!/.*/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 1.2.1.3
      NIST800-53R4: SI-2
    {{ end }}
  {{ end }}
{{ end }}
