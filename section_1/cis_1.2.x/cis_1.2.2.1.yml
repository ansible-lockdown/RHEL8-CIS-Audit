---

{{ if .Vars.run_heavy_tests }}
  {{ if .Vars.rhel8cis_level_1 }}
    {{ if .Vars.rhel8cis_rule_1_2_2_1 }}
command:
  security-updates:
    title: 1.2.2.1 | Ensure updates, patches, and additional security software are installed
    exit-status: 0
    timeout: {{ .Vars.timeout_ms }}
    exec: dnf check-update
    stdout:
    - '!/.*(x86_64|386|noarch).*el8/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 1.2.2.1
      NIST800-53R4: SI-2
    {{ end }}
  {{ end }}
{{ end }}
