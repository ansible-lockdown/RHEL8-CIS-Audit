---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_3_2_6 }}
command:
  modprobe_tipc:
    title: 3.2.6 | Ensure tipc kernel module is not available | tipc config
    exit-status: 0
    exec: 'modprobe -n -v tipc'
    stdout:
      - '/install /bin/(true|false)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.2.6
      NIST800-53R5:
      - CM-7
      CCI:
      - CCI-000381
  lsmod_tipc:
    title: 3.2.6 | Ensure tipc kernel module is not available | running tipc
    exit-status: 1
    exec: lsmod | grep -i tipc
    stdout:
    - '!/^.*/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 3.2.6
      NIST800-53R5:
      - CM-7
      CCI:
      - CCI-000381
  {{ end }}
{{ end }}
