---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_2_1_10 }}
    {{ if not .Vars.rhel8cis_nis_server }}
      {{ if not .Vars.rhel8cis_nis_mask }}
package:
  nis_pkg:
    title: 2.1.10 | Ensure nis server services are not in use | pkg removed
    name: ypserv
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.10
      NIST800-53R5:
      - CM-7
      {{ end }}
      {{ if .Vars.rhel8cis_print_mask }}
file:
  nis_service_masked:
    title: 2.1.10 | Ensure nis server services are not in use | masked
    path: /etc/systemd/system/ypserv.service
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.10
      NIST800-53R5:
      - CM-7
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
