---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_2_1_19 }}
      {{ if not .Vars.rhel8cis_nginx_mask }}
package:
  nginx_pkg:
    title: 2.1.19 | Ensure web server services are not in use | pkg removed
    skip: {{ .Vars.rhel8cis_nginx_server }}
    name: nginx
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.19
      NIST800-53R5:
      - CM-7
  nginx_plus_pkg:
    title: 2.1.19 | Ensure web server services are not in use | nginx-plus pkg removed
    skip: {{ .Vars.rhel8cis_nginx_server }}
    name: nginx-plus
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.19
      NIST800-53R5:
      - CM-7
      {{ end }}
      {{ if .Vars.rhel8cis_nginx_mask }}
file:
  nginx_service_masked:
    title: 2.1.19 | Ensure web server services are not in use | masked
    skip: {{ .Vars.rhel8cis_nginx_server }}
    path: /etc/systemd/system/nginx.service
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.19
      NIST800-53R5:
      - CM-7
      {{ end }}
  {{ end }}
{{ end }}
