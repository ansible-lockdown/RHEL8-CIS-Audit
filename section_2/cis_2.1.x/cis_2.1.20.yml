---

{{ if .Vars.rhel8cis_level_2 }}
  {{ if .Vars.rhel8cis_rule_2_1_20 }}
    {{ if not .Vars.rhel8cis_xinetd_server }}
      {{ if not .Vars.rhel8cis_xinetd_mask }}
package:
  xinetd_pkg:
    title: 2.1.20 | Ensure xinetd services are not in use | pkg removed
    name: xinetd
    installed: false
    meta:
      server: 2
      workstation: N/A
      CIS_ID:
      - 2.1.20
      NIST800-53R5:
      - CM-7
{{ end }}
{{ if .Vars.rhel8cis_xinetd_mask }}
file:
  xinetd_service_masked:
    title: 2.1.20 | Ensure xinetd services are not in use | masked
    path: /etc/systemd/system/xinetd.service
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 2
      workstation: N/A
      CIS_ID:
      - 2.1.20
      NIST800-53R5:
      - CM-7
      {{ end }}
    {{ end }}
  {{ end }}
{{ end }}
