---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_2_1_23 }}
command:
  mta_listening_ports:
    title: 2.1.23 | Ensure mail transfer agents are configured for local-only mode | not listening on non-loopback
    skip: {{ .Vars.rhel8cis_is_mail_server }}
    exec: ss -plntu | grep -P -- ':(25|465|587)\b' | grep -Pv -- '\h+(127\.0\.0\.1|\[?::1\]?):(25|465|587)\b'
    exit-status: 1
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.23
      NIST800-53R5:
      - CM-7
  mta_postfix_inet_interfaces:
    title: 2.1.23 | Ensure mail transfer agents are configured for local-only mode | postfix inet_interfaces
    skip: {{ .Vars.rhel8cis_is_mail_server }}
    exec: "rpm -q postfix >/dev/null 2>&1 || { echo 'postfix not installed'; exit 0; }; postconf -h inet_interfaces"
    exit-status: 0
    stdout:
    - '/^(postfix not installed|loopback-only|localhost)$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.23
      NIST800-53R5:
      - CM-7
  {{ end }}
{{ end }}
