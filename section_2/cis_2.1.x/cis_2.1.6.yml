---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_2_1_6 }}
      {{ if not .Vars.rhel8cis_dnsmasq_mask }}
package:
  dnsmasq_pkg:
    title: 2.1.6 | Ensure dnsmasq services are not in use | pkg removed
    skip: {{ .Vars.rhel8cis_dnsmasq_server }}
    skip-reason: rhel8cis_dnsmasq_server is true
    name: dnsmasq
    installed: false
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.6
      NIST800-53R5:
      - CM-7
      {{ end }}
      {{ if .Vars.rhel8cis_dnsmasq_mask }}
file:
  dnsmasq_service_masked:
    title: 2.1.6 | Ensure dnsmasq services are not in use | masked
    skip: {{ .Vars.rhel8cis_dnsmasq_server }}
    skip-reason: rhel8cis_dnsmasq_server is true
    path: /etc/systemd/system/dnsmasq.service
    exists: true
    filetype: symlink
    linked-to: /dev/null
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 2.1.6
      NIST800-53R5:
      - CM-7
      {{ end }}
  {{ end }}
{{ end }}
