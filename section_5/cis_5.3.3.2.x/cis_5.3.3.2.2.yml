---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_3_3_2_2 }}
file:
  minlen_pwquality:
    title: 5.3.3.2.2 | Ensure password length is configured
    skip: {{ not .Vars.rhel8cis_disruption_high }}
    path: /etc/security/pwquality.conf
    exists: true
    contents:
    - '/^\s*minlen\s*=\s*(1[4-9]|[2-9][0-9]|[1-9][0-9]{2,})\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.2.2
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
