---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_2_3 }}
command:
  log_sudoers_d:
    title: 5.2.3 | Ensure sudo log file exists | sudoers.d
    exec: grep -rPsi -- '^\h*Defaults\h+([^#]+,\h*)?logfile\h*=\h*("|\x27)?\H+("|\x27)?(,\h*\H+\h*)*\h*(#.*)?$' /etc/sudoers /etc/sudoers.d/
    exit-status: 0
    stdout:
    - '/(?i)logfile\s*=/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.2.3
      NIST800-53R5:
      - AU-3
      - AU-12
  {{ end }}
{{ end }}
