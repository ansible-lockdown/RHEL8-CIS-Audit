---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_2_7 }}
file:
  restrict_su:
    title: 5.2.7 | Ensure access to the su command is restricted
    path: /etc/pam.d/su
    exists: true
    contents:
      - '/^\s*auth\s+(required|requisite)\s+pam_wheel\.so\s+(\S+\s+)*(use_uid\s+(\S+\s+)*group={{ .Vars.rhel8cis_sugroup }}|group={{ .Vars.rhel8cis_sugroup }}\s+(\S+\s+)*use_uid)(\s|$)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.2.7
      NIST800-53R5:
      - AC-3
      - MP-2
  sugroup_etc_group:
    title: 5.2.7 | Ensure access to the su command is restricted | sugroup has no members
    path: /etc/group
    exists: true
    contents:
    - '/^{{ .Vars.rhel8cis_sugroup }}:[^:]*:[0-9]+:$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.2.7
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
