---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_3_3_3_2 }}
file:
  enforce_for_root_pwhistory:
    title: 5.3.3.3.2 | Ensure password history is enforced for the root user
    exists: true
    path: /etc/security/pwhistory.conf
    contents:
    - '/^enforce_for_root/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.3.2
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
