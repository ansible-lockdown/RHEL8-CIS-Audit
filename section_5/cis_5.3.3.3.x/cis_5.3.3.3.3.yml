---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_3_3_3_3 }}
file:
  authtok_pwhistory_passwd:
    title: 5.3.3.3.3 | Ensure password history remember is configured | password-auth
    exists: true
    path: /etc/pam.d/password-auth
    contents:
    - '/^password\s+(requisite|required)\s+pam_pwhistory.so.*use_authtok/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.3.3
      NIST800-53R5: IA-5
  authtok_pwhistory_system:
    title: 5.3.3.3.3 | Ensure password history remember is configured | system-auth
    exists: true
    path: /etc/pam.d/system-auth
    contents:
    - '/^password\s+(requisite|required)\s+pam_pwhistory.so.*use_authtok/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.3.3
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
