---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_3_2_1 }}
command:
  authselect_profile:
    title: 5.3.2.1 | Ensure active authselect profile includes pam modules
    exec: 'authselect current'
    exit-status: 0
    stdout:
    - '/^Profile ID: custom/{{ .Vars.rhel8cis_authselect_custom_profile_name }}/'
    - '/^- with-pwhistory/'
    - '/^- with-faillock/'
    - '/^- without-nullok/'
    - '!/No existing configuration detected/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.1
  {{ end }}
{{ end }}
