---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_3_2_4 }}
file:
  authselect_pam_pwhistory_password:
    title: 5.3.2.4 | Ensure pam_pwhistory module is enabled | password-auth
    path: /etc/pam.d/password-auth
    exists: true
    contents:
    - '/^password\s+(requisite|required)\s+pam_pwhistory.so use_authtok/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.4
      NIST800-53R5: IA-5
  authselect_pam_pwhistory_system:
    title: 5.3.2.4 | Ensure pam_pwhistory module is enabled | system-auth
    path: /etc/pam.d/system-auth
    exists: true
    contents:
    - '/^password\s+(requisite|required)\s+pam_pwhistory.so use_authtok/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.4
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
