---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_3_2_3 }}
file:
  authselect_pam_pwquality_password:
    title: 5.3.2.3 | Ensure pam_pwquality module is enabled | password-auth
    path: /etc/pam.d/password-auth
    exists: true
    contents:
    - '/^password\s+(requisite|required)\s+pam_pwquality.so/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.3
      NIST800-53R5: CM-6
  authselect_pam_pwquality_system:
    title: 5.3.2.3 | Ensure pam_pwquality module is enabled | system-auth
    path: /etc/pam.d/system-auth
    exists: true
    contents:
    - '/^password\s+(requisite|required)\s+pam_pwquality.so/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.3
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
