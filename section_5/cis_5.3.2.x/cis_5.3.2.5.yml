---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_3_2_5 }}
file:
  authselect_pam_unix_password:
    title: 5.3.2.5 | Ensure pam_unix module is enabled | password-auth
    path: /etc/pam.d/password-auth
    exists: true
    contents:
    - '/^auth\s+sufficient\s+pam_unix.so/'
    - '/^account\s+required\s+pam_unix.so/'
    - '/^password\s+sufficient\s+pam_unix.so/'
    - '/^session\s+required\s+pam_unix.so/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.5
      NIST800-53R5: IA-5
  authselect_pam_unix_system:
    title: 5.3.2.5 | Ensure pam_unix module is enabled | system-auth
    path: /etc/pam.d/system-auth
    exists: true
    contents:
    - '/^auth\s+sufficient\s+pam_unix.so/'
    - '/^account\s+required\s+pam_unix.so/'
    - '/^password\s+sufficient\s+pam_unix.so/'
    - '/^session\s+required\s+pam_unix.so/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.5
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
