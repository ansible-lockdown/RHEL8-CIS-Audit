---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_3_2_2 }}
file:
  authselect_pam_faillock_password:
    title: 5.3.2.2 | Ensure pam_faillock module is enabled | password-auth
    path: /etc/pam.d/password-auth
    exists: true
    contents:
    - '/^auth\s+required\s+pam_faillock.so preauth/'
    - '/^auth\s+required\s+pam_faillock.so authfail/'
    - '/^account\s+required\s+pam_faillock.so/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.2
      NIST800-53R5:
      - AC-7
  authselect_pam_faillock_system:
    title: 5.3.2.2 | Ensure pam_faillock module is enabled | system-auth
    path: /etc/pam.d/system-auth
    exists: true
    contents:
    - '/^auth\s+required\s+pam_faillock.so preauth/'
    - '/^auth\s+required\s+pam_faillock.so authfail/'
    - '/^account\s+required\s+pam_faillock.so/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.2.2
      NIST800-53R5:
      - AC-7
  {{ end }}
{{ end }}
