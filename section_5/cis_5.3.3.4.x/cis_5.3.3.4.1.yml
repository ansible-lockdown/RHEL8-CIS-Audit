---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_3_3_4_1 }}
file:
  not_nullok_pwhistory_password:
    title: 5.3.3.4.1 | Ensure pam_unix does not include nullok | password-auth
    exists: true
    path: /etc/pam.d/password-auth
    contents:
    - '!/^(auth|account|password|session)\s+(requisite|required|sufficient)\s+pam_unix.so.*nullok/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.4.1
      NIST800-53R5: CM-6
  not_nullok_pwhistory_system:
    title: 5.3.3.4.1 | Ensure pam_unix does not include nullok | system-auth
    exists: true
    path: /etc/pam.d/system-auth
    contents:
    - '!/^(auth|account|password|session)\s+(requisite|required|sufficient)\s+pam_unix.so.*nullok/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.4.1
      NIST800-53R5: CM-6
  {{ end }}
{{ end }}
