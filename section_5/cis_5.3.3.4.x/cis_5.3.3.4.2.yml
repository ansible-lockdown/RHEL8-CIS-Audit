---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_3_3_4_2 }}
file:
  not_remember_pwhistory_password:
    title: 5.3.3.4.2 | Ensure pam_unix does not include remember | password-auth
    exists: true
    path: /etc/pam.d/password-auth
    contents:
    - '!/^password\s+(requisite|required|sufficient)\s+pam_unix.so.*remember/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.4.2
      NIST800-53R5: NA
  not_remember_pwhistory_system:
    title: 5.3.3.4.2 | Ensure pam_unix does not include remember | system-auth
    exists: true
    path: /etc/pam.d/system-auth
    contents:
    - '!/^password\s+(requisite|required|sufficient)\s+pam_unix.so.*remember/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.4.2
      NIST800-53R5: NA
  {{ end }}
{{ end }}
