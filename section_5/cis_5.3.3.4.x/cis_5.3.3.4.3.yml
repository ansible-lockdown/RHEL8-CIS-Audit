---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_3_3_4_3 }}
file:
  hash_algo_pwhistory_password:
    title: 5.3.3.4.3 | Ensure pam_unix includes a strong password hashing algorithm | password-auth
    exists: true
    path: /etc/pam.d/password-auth
    contents:
    - '/^password\s+(requisite|required|sufficient)\s+pam_unix.so.*(sha512|yescrypt)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.4.3
      NIST800-53R5: IA-5
  hash_algo_pwhistory_system:
    title: 5.3.3.4.3 | Ensure pam_unix includes a strong password hashing algorithm | system-auth
    exists: true
    path: /etc/pam.d/system-auth
    contents:
    - '/^password\s+(requisite|required|sufficient)\s+pam_unix.so.*(sha512|yescrypt)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.4.3
      NIST800-53R5: IA-5
  {{ end }}
{{ end }}
