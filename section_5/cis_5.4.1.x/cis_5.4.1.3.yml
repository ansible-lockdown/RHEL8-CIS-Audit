---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_4_1_3 }}
file:
  login_defs_warn_age:
    title: 5.4.1.3 | Ensure password expiration warning days is configured
    path: /etc/login.defs
    exists: true
    contents:
    - '/^PASS_WARN_AGE\s+{{ .Vars.rhel8cis_pass_warn_age }}\s*$/'
    - '/^PASS_WARN_AGE\s+([7-9]|[1-9][0-9]+)\s*$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.3
      NIST800-53R5: NA
command:
  check_users_warn_age:
    title: 5.4.1.3 | Ensure password expiration warning days is configured | check_users
    skip: {{ not .Vars.rhel8cis_force_user_warnage }}
    skip-reason: the role changes existing users only when rhel8cis_force_user_warnage is true
    exec: |
      awk -F: '($2~/^\$.+\$/) {if($6 == "" || $6 < 7) print "FAIL: " $1 " PASS_WARN_AGE: " $6}' /etc/shadow
      echo "scan_done"
    exit-status: 0
    stdout:
    - '/^scan_done$/'
    - '!/^FAIL:/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.3
      NIST800-53R5: NA
  {{ end }}
{{ end }}
