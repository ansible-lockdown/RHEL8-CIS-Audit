---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_4_1_5 }}
command:
  inactive_passwd:
    title: 5.4.1.5 | Ensure inactive password lock is configured
    exec: useradd -D | grep INACTIVE
    exit-status: 0
    stdout:
    - '/^INACTIVE=([1-9]|[0-2][0-9]|30)/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.5
      NIST800-53R5: NA
  inactive_users:
    title: 5.4.1.5 | Ensure inactive password lock is configured
    exec: 'grep -E ^[^:]+:[^\!*] /etc/shadow | grep -vw root | cut -d : -f1,7'
    stdout:
    - '!/.//'
    exit-status: 0
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.4.1.5
      NIST800-53R5: NA
  {{ end }}
{{ end }}
