---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_3_3_1_2 }}
file:
  unlock_faillock.conf:
    title: 5.3.3.1.2 | Ensure password unlock time is configured
    skip: {{ not .Vars.rhel8cis_disruption_high }}
    exists: true
    path: /etc/security/faillock.conf
    contents:
    - '/^\s*unlock_time\s*=\s*(0|9[0-9][0-9]|[1-9][0-9]{3,})\b/'
    - '!/^\s*unlock_time\s*=\s*([1-9]|[1-9][0-9]|[1-8][0-9][0-9])\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.1.2
      NIST800-53R5: NA
  {{ end }}
{{ end }}
