---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_3_3_1_2 }}
file:
  unlock_faillock.conf:
    title: 5.3.3.1.2 | Ensure password unlock time is configured
    exists: true
    path: /etc/security/faillock.conf
    contents:
    - '/^unlock_time = {{ .Vars.rhel8cis_pam_faillock.unlock_time }}/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.1.2
      NIST800-53R5: NA
  {{ end }}
{{ end }}
