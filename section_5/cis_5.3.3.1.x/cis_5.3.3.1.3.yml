---

{{ if .Vars.rhel8cis_level_2 }}
  {{ if .Vars.rhel8cis_rule_5_3_3_1_3 }}
file:
  root_unlock_faillock.conf:
    title: 5.3.3.1.3 | Ensure password failed attempts lockout includes root account
    exists: true
    path: /etc/security/faillock.conf
    contents:
    - '/^(even_deny_root|root_unlock_time = {{ .Vars.rhel8cis_pam_faillock_root_unlock_time }})/'
    meta:
      server: 2
      workstation: 2
      CIS_ID:
      - 5.3.3.1.3
      NIST800-53R5: NA
  {{ end }}
{{ end }}
