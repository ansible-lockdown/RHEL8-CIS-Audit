---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_3_3_1_1 }}
file:
  deny_faillock.conf:
    title: 5.3.3.1.1 | Ensure password failed attempts lockout is configured
    skip: {{ not .Vars.rhel8cis_disruption_high }}
    exists: true
    path: /etc/security/faillock.conf
    contents:
    - '/^\s*deny\s*=\s*[1-5]\b/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.1.1
      NIST800-53R5: NA
  {{ end }}
{{ end }}
