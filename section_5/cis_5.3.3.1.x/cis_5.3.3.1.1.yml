---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_3_3_1_1 }}
file:
  deny_faillock.conf:
    title: 5.3.3.1.1 | Ensure password failed attempts lockout is configured
    exists: true
    path: /etc/security/faillock.conf
    contents:
    - '/^deny = {{ .Vars.rhel8cis_pam_faillock_deny }}/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.3.3.1.1
      NIST800-53R5: NA
  {{ end }}
{{ end }}
