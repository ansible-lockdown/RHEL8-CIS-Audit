---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_1_2 }}
file:
  sshd_config_perms:
    title: 5.1.2 | Ensure access to /etc/ssh/sshd_config is configured
    path: /etc/ssh/sshd_config
    exists: true
    mode:
      or:
      - "0600"
      - "0400"
    owner: root
    group: root
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.2
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
