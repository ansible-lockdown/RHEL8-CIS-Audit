---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_1_3 }}
file:
  sysconfig_sshd_config:
    title: 5.1.3 | Ensure access to /etc/sysconfig/sshd is configured
    path: /etc/sysconfig/sshd
    exists: true
    mode:
      or:
      - "0640"
      - "0600"
      - "0440"
      - "0400"
    owner: root
    group: root
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.3
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
