---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_1_1 }}
file:
  sshd_crypto_policy:
    title: 5.1.1 | Ensure sshd crypto_policy is not set
    path: /etc/sysconfig/sshd
    exists: true
    contents:
    - '!/(?i)^crypto_policy.*/'
    owner: root
    group: root
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.1
      NIST800-53R5:
      - AC-3
      - MP-2
  {{ end }}
{{ end }}
