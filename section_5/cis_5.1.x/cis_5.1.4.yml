---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_1_4 }}
command:
  /etc/ssh/ssh_host_prv_key_user:
    title: 5.1.4 | Ensure access to SSH private host key files is configured
    exec: "userkeys=$(sudo find /etc/ssh/ -name *_key -type f ! -user root ! \\( -group root -o -group ssh_keys \\) ); echo $userkeys"
    exit-status: 0
    stdout: ['!/./']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.4
      NIST800-53R5:
      - CM-6
      CCI:
      - CCI-000366
  /etc/ssh/ssh_host_prv_key_group:
    title: 5.1.4 | Ensure access to SSH private host key files is configured
    exec: groupkeys=$(sudo find /etc/ssh/ -name *_key -type f ! \(-group root -o ! -group ssh_keys \) ); echo $groupkeys
    exit-status: 0
    stdout: ['!/./']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.4
      NIST800-53R5:
      - CM-6
      CCI:
      - CCI-000366
  /etc/ssh/ssh_host_prv_key_perms:
    title: 5.1.4 | Ensure access to SSH private host key files is configured
    exec: "keyperms=$(sudo find /etc/ssh/ -name *_key -type f -perm /137 ); echo $keyperms"
    exit-status: 0
    stdout: ['!/./']
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.4
      NIST800-53R5:
      - CM-6
      CCI:
      - CCI-000366
  {{ end }}
{{ end }}
