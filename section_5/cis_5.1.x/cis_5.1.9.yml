---

{{ if .Vars.rhel8cis_level_1 }}
  {{ if .Vars.rhel8cis_rule_5_1_9 }}
file:
  sshd_clientalive:
    title: 5.1.9 | Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured
    path: /etc/ssh/sshd_config
    exists: true
    contents:
    - '/(?i)^\s*ClientAliveInterval\s+[1-9][0-9]*\s*$/'
    - '/(?i)^\s*ClientAliveCountMax\s+[1-9][0-9]*\s*$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.9
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
command:
  sshd_clientalive_live:
    title: 5.1.9 | Ensure sshd ClientAliveInterval and ClientAliveCountMax are configured | live
    exec: sshd -T | grep -i '^clientalive'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/(?i)^clientaliveinterval [1-9][0-9]*$/'
    - '/(?i)^clientalivecountmax [1-9][0-9]*$/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 5.1.9
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
  {{ end }}
{{ end }}
