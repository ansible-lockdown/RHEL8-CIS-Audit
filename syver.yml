---

# Oldest syver this content needs; unknown top-level keys are errors
syver-version: 0.20.0

# Host facts that decide whether a test applies; the test is skipped with a reason when it does not
discovery:
  # Partitions the role only checks when they exist (1.1.2.3 - 1.1.2.7 mount options)
  mount:
    /home:
      register: home_mounted
      exists: true
    /var:
      register: var_mounted
      exists: true
    /var/tmp:
      register: var_tmp_mounted
      exists: true
    /var/log:
      register: var_log_mounted
      exists: true
    /var/log/audit:
      register: var_log_audit_mounted
      exists: true
  # 2.1.23 postfix main.cf is only checked when postfix is installed
  package:
    postfix:
      register: postfix_installed
      installed: true
  # 7.1.10 opasswd files the benchmark says may not exist
  file:
    /etc/security/opasswd:
      register: opasswd_exists
      exists: true
    /etc/security/opasswd.old:
      register: opasswd_old_exists
      exists: true

syverfile:
  {{ if .Vars.rhel8cis_section1 }}
  section_1/*/*.yml: {}
  {{ end }}

  {{ if .Vars.rhel8cis_section2 }}
  section_2/*/*.yml: {}
  {{ end }}

  {{ if .Vars.rhel8cis_section3 }}
  section_3/cis_3.1.x/*.yml: {}
  section_3/cis_3.2.x/*.yml: {}
  section_3/cis_3.3.1.x/*.yml: {}
  # IPv6 network kernel parameters, skipped with a reason when rhel8cis_ipv6_required is false
  section_3/cis_3.3.2.x/*.yml: {}
  {{ end }}

  {{ if .Vars.rhel8cis_section4 }}
  {{ if eq .Vars.rhel8cis_firewall "firewalld" }}
  section_4/*/*.yml: {}
  {{ end }}
  {{ end }}

  {{ if .Vars.rhel8cis_section5 }}
  section_5/*/*.yml: {}
  {{ end }}

  {{ if .Vars.rhel8cis_section6 }}
  section_6/cis_6.1.x/*.yml: {}
  {{ if eq .Vars.rhel8cis_syslog "journald" }}
  section_6/cis_6.2.1.1.x/*.yml: {}
  section_6/cis_6.2.1.2.x/*.yml: {}
  {{ end }}
  {{ if eq .Vars.rhel8cis_syslog "rsyslog" }}
  section_6/cis_6.2.2.x/*.yml: {}
  {{ end }}
  section_6/cis_6.2.3.x/*.yml: {}
  section_6/cis_6.3.*.x/*.yml: {}
  {{ end }}

  {{ if .Vars.rhel8cis_section7 }}
  section_7/*/*.yml: {}
  {{ end }}

command:
  benchmark_meta:
    title: Benchmark MetaData
    exec: echo BenchMark MetaData
    exit-status: 0
    meta:
      host_machine_uuid: {{ .Vars.machine_uuid }}
      host_epoch: {{ .Vars.epoch }}
      host_os_locale: {{ .Vars.os_locale }}
      host_os_release: {{ .Vars.os_release }}
      host_os_distribution: {{ .Vars.os_distribution }}
      host_automation_group: {{ .Vars.auto_group }}
      host_hostname: {{ .Vars.os_hostname }}
      host_system_type: {{ .Vars.system_type }}
      benchmark_type: {{ .Vars.benchmark_type }}
      benchmark_version: {{ .Vars.benchmark_version }}
      benchmark_os: {{ .Vars.benchmark_os }}
